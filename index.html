<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Witch – Game Feedback</title>
  <!-- Google Fonts: Cinzel (หัวข้อ) + Krub (เนื้อหาไทย) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Krub:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <main class="card">
    <header>
      <h1>ARCANUM</h1>
      <p class="subtitle">THANKS FOR PLAYTESTING</p>
    </header>

    <form id="feedback-form" novalidate>
      <!-- Honeypot ป้องกันบอทสแปม -->
      <div class="hp" aria-hidden="true">
        <label>Leave empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <!-- แถบแสดงความคืบหน้าคำถามบังคับ -->
<div class="progress-wrapper">
  <div class="progress-info">
    <span class="progress-label">ความคืบหน้า (คำถามบังคับ)</span>
    <span id="progress-text">0 / 0 (0%)</span>
  </div>
  <div class="progress-track">
    <div id="progress-bar"></div>
  </div>
</div>

      <!-- คอนเทนเนอร์สำหรับสร้างคำถามอัตโนมัติจาก JSON -->
      <div id="dynamic-questions"></div>

      <p id="status" role="status" aria-live="polite"></p>
      <button type="submit" id="submit-btn">ส่ง FEEDBACK</button>
    </form>
  </main>

  <!-- นำเข้าไฟล์ตั้งค่าคำถาม และ script หลัก -->
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
